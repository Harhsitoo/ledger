name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pip cache: Ledger is a pure-stdlib library with pytest as its only
      # development dependency, so there is nothing worth caching and the
      # cache step fails without a requirements file to key on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - run: python -m pytest -q
